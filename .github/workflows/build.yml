name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-onyxcc:
    name: OnyxCompiller (host + selfhost)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: DivByDiamond/OnyxCompiller
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Build host onyxcc
        run: make -j$(nproc)
      - name: Self-hosting test (compile own sources)
        run: make selfhost-test
      - name: Self-hosting full build
        run: make selfhost
      - name: Upload onyxcc_self.onx
        uses: actions/upload-artifact@v6
        with:
          name: onyxcc_self
          path: onyxcc_self.onx

  build-onyxboot:
    name: OnyxBoot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: DivByDiamond/OnyxBoot
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf make || \
          sudo apt-get install -y gcc-riscv64-linux-gnu make
      - name: Build
        run: |
          if command -v riscv64-unknown-elf-gcc &>/dev/null; then
            make -j$(nproc)
          elif command -v riscv64-linux-gnu-gcc &>/dev/null; then
            make -j$(nproc) CROSS=riscv64-linux-gnu CC=riscv64-linux-gnu-gcc
          else
            echo "No RISC-V cross-compiler found"
            exit 1
          fi
      - name: Upload kernel.elf
        uses: actions/upload-artifact@v6
        with:
          name: onyxboot-elf
          path: bootloader.elf

  build-onyxkernel:
    name: OnyxKernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: DivByDiamond/OnyxKernel
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv64gc-unknown-none-elf
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build kernel
        run: cargo build --release -p onyx_kernel --target riscv64gc-unknown-none-elf
      - name: Build tools
        run: cargo build --release -p onyx_tools
      - name: Run core tests
        run: cargo test -p onyx_core
      - name: Upload kernel
        uses: actions/upload-artifact@v6
        with:
          name: onyxkernel-elf
          path: target/riscv64gc-unknown-none-elf/release/onyx-kernel

  qemu-smoke:
    name: QEMU boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-riscv64 dosfstools mtools parted cmake build-essential libcurl4-openssl-dev libarchive-dev gcc-riscv64-unknown-elf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv64gc-unknown-none-elf
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build all components
        run: bash scripts/bootstrap.sh && bash scripts/build-all.sh
      - name: Build disk image
        run: bash scripts/mk-onyxfs-disk.sh
      - name: Boot test (headless QEMU, full chain)
        timeout-minutes: 6
        run: bash scripts/qemu-smoke.sh

  build-onyxshell:
    name: OnyxShell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: DivByDiamond/OnyxShell
      - uses: actions/checkout@v6
        with:
          repository: DivByDiamond/OnyxKernel
          path: OnyxKernel
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv64gc-unknown-none-elf
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            OnyxKernel
      - name: Build
        env:
          ONYXKERNEL_DIR: ${{ github.workspace }}/OnyxKernel
        run: bash build.sh

  build-onyxos:
    name: OnyxOS meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev libarchive-dev
      - name: Setup Vent
        run: bash scripts/bootstrap.sh
      - name: Verify all repos cloned
        run: |
          for repo in OnyxKernel OnyxBoot OnyxShell OnyxCompiller; do
            if [ -d ".vent/repos/$repo" ]; then
              echo "✓ $repo"
            else
              echo "✗ $repo missing"
              exit 1
            fi
          done
