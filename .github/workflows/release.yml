name: Release

# Triggers:
#   - push of a git tag (v0.3.0-style) -> full release: build + GitHub Release + onyx-flash.img asset
#   - push to main branch              -> preview build (image uploaded as artifact, NO release created)
#   - manual (workflow_dispatch)       -> for debugging from the UI
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  # =====================================================================
  # BUILD — builds all components via the vent/Makefile and assembles the
  # complete flash image onyx-flash.img (exactly 15 MB, "minux" layout).
  # =====================================================================
  build:
    name: Build onyx-flash.img
    runs-on: ubuntu-latest
    env:
      # Where to fetch fw_jump.bin from when it is not committed to the
      # repository. Can be provided via the OC2R_FW_JUMP_URL repository
      # variable (Settings -> Secrets and variables -> Actions -> Variables).
      OC2R_FW_JUMP_URL: ${{ vars.OC2R_FW_JUMP_URL }}
    steps:
      # 1. Checkout the OnyxOS repository. Dependencies (OnyxBoot/OnyxKernel/
      #    OnyxShell/OnyxCompiller) are pulled by the .vent system on step 4.
      #    submodules — in case git submodules appear in the repo.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # 2. System dependencies:
      #    - cmake/git/build-essential + libcurl/libarchive dev — to build .vent/vent
      #      from source (Makefile `deps` target) and the host OnyxCC compiler
      #    - gcc-riscv64-unknown-elf — cross-compiler for OnyxBoot (bootloader)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            build-essential \
            libcurl4-openssl-dev \
            libarchive-dev
          # RISC-V cross-toolchain for the bootloader.
          # gcc-riscv64-unknown-elf is in universe since Ubuntu 22.04.
          # If unavailable, fall back to gcc-riscv64-linux-gnu
          # (different prefix; the build then uses CROSS=riscv64-linux-gnu).
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf \
            || sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

      # 3. Rust toolchain.
      #    Nightly — same as the other Onyx CI workflows (kernel and shell need nightly).
      #    edition 2024 (rust-version 1.85+). Target riscv64gc-unknown-none-elf:
      #    bare-metal std-less kernel, so --target is mandatory when building.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv64gc-unknown-none-elf

      # 4. make deps:
      #    - builds .vent/vent from source (grafmorkov/vent) via cmake
      #    - runs .vent/vent -j 4 Onyx.vent -> clones OnyxKernel,
      #      OnyxBoot, OnyxShell, OnyxCompiller into .vent/repos/
      - name: Resolve dependencies (make deps)
        run: make deps

      # 5. Component builds.
      #    Note: `make build` in the Makefile = build-boot + build-kernel +
      #    build-shell + build-compiller, but it does not work as-is in CI, so
      #    the steps are split explicitly (see comments below).
      #    a) build-kernel: a bare `cargo build` without --target builds the
      #       bare-metal kernel for the host (x86_64) and fails on riscv-asm.
      #       The kernel is built explicitly for riscv64gc-unknown-none-elf —
      #       the same trick as scripts/run-qemu.sh and OnyxKernel CI.
      - name: Build bootloader (OnyxBoot)
        run: |
          cd .vent/repos/OnyxBoot
          if command -v riscv64-unknown-elf-gcc &>/dev/null; then
            make -j"$(nproc)"
          else
            make -j"$(nproc)" CROSS=riscv64-linux-gnu
          fi

      # OC2R/OpenSBI (fw_jump) boots the kernel directly in S-mode,
      # so the kernel must be built with the `smode` feature.
      - name: Build kernel (OnyxKernel, riscv64gc)
        run: |
          cargo build --release \
            -p onyx_kernel \
            --target riscv64gc-unknown-none-elf \
            --features smode \
            --manifest-path .vent/repos/OnyxKernel/Cargo.toml

      #    b) host tools (elf2onx / mkimage / psfgen) are needed by OnyxShell:
      #       its build.sh looks for elf2onx under target/<host-target>/release/.
      #       So onyx_tools is built explicitly for the host (x86_64-unknown-linux-gnu).
      - name: Build host tools (elf2onx / mkimage / psfgen)
        run: |
          HOST_TARGET="$(rustc -vV | sed -ne 's/^host: //p')"
          cargo build --release \
            -p onyx_tools \
            --target "$HOST_TARGET" \
            --manifest-path .vent/repos/OnyxKernel/Cargo.toml

      #    c) build-shell: builds OnyxShell via bash build.sh and converts it
      #       to osh.onx (elf2onx is already built on the previous step).
      - name: Build shell (OnyxShell)
        run: make build-shell

      #    d) build-compiller: OnyxCompiller has NO `host` target
      #       (it is absent from its Makefile; the right target is `all`/default).
      #       So instead of `make host` we run plain `make`.
      - name: Build compiler (OnyxCompiller)
        run: |
          make -C .vent/repos/OnyxCompiller

      # 6. fw_jump.bin (OpenSBI) — first boot stage, lives in the OC2R mod at
      #    src/main/scripts/firmware_files/fw_jump.bin. It is not in this repo,
      #    so the resolution order is:
      #      1) commit firmware/fw_jump.bin to the repository — it is used;
      #      2) otherwise download from the OC2R_FW_JUMP_URL repo variable;
      #      3) otherwise create a placeholder — the image builds but will
      #         NOT boot. For a working release, provide the real OpenSBI
      #         via method 1 or set the URL via method 2.
      - name: Obtain fw_jump.bin (OpenSBI)
        run: |
          set -euo pipefail
          mkdir -p firmware
          FW_JUMP="firmware/fw_jump.bin"
          if [ -f "$FW_JUMP" ]; then
            echo "[+] fw_jump.bin found in repository: $FW_JUMP"
          elif [ -n "${OC2R_FW_JUMP_URL:-}" ]; then
            echo "[+] Downloading fw_jump.bin from: $OC2R_FW_JUMP_URL"
            curl -fsSL "$OC2R_FW_JUMP_URL" -o "$FW_JUMP"
          else
            echo "[!] fw_jump.bin is missing. Creating a zero placeholder."
            echo "[!] Real OpenSBI lives in the OC2R mod at"
            echo "[!]   src/main/scripts/firmware_files/fw_jump.bin"
            echo "[!] Commit it as firmware/fw_jump.bin or set the"
            echo "[!]   OC2R_FW_JUMP_URL repository variable."
            dd if=/dev/zero of="$FW_JUMP" bs=1K count=64
          fi
          ls -l "$FW_JUMP"

      # 7. Assemble the complete flash image, exactly 15 MB, "minux" layout:
      #      offset 0x000000 (0)    -> fw_jump.bin (OpenSBI)
      #      offset 0x200000 (2 MB) -> OnyxKernel (raw binary)
      #      rest up to 15 MB       -> zeros
      #
      #    IMPORTANT: OpenSBI (fw_jump) jumps directly to 0x80200000, so raw
      #    machine code must live there, NOT an ELF. First convert the ELF to
      #    a flat binary via objcopy (as OnyxBoot does for bootloader.bin).
      #    The ELF links with KERNEL_BASE = 0x80200000 (kernel/linker.ld), so
      #    the first byte of the raw binary = the first _start instruction at 0x80200000.
      - name: Assemble onyx-flash.img (15 MB, layout minux)
        run: |
          set -euo pipefail
          IMG="onyx-flash.img"
          FLASH_MB=15
          FW_JUMP="firmware/fw_jump.bin"
          KERNEL_ELF=".vent/repos/OnyxKernel/target/riscv64gc-unknown-none-elf/release/onyx-kernel"
          KERNEL_BIN="kernel.bin"

          [ -f "$KERNEL_ELF" ] || { echo "ERROR: kernel ELF not found: $KERNEL_ELF"; exit 1; }

          # Locate a riscv objcopy (prefix depends on the installed toolchain).
          OBJCOPY=""
          for c in riscv64-unknown-elf-objcopy riscv64-elf-objcopy riscv64-linux-gnu-objcopy; do
            if command -v "$c" &>/dev/null; then OBJCOPY="$c"; break; fi
          done
          [ -n "$OBJCOPY" ] || { echo "ERROR: no riscv objcopy found"; exit 1; }

          echo "[+] ELF -> raw: $OBJCOPY -O binary $KERNEL_ELF $KERNEL_BIN"
          "$OBJCOPY" -O binary "$KERNEL_ELF" "$KERNEL_BIN"

          # 15 MB of zeros — base canvas of the image
          dd if=/dev/zero of="$IMG" bs=1M count=$FLASH_MB

          # OpenSBI at offset 0
          dd if="$FW_JUMP" of="$IMG" conv=notrunc

          # Kernel (raw) at offset 2 MB (0x200000)
          dd if="$KERNEL_BIN" of="$IMG" bs=1M seek=2 conv=notrunc

          # Size check: exactly 15 MB = 15728640 bytes
          SIZE="$(stat -c%s "$IMG")"
          EXPECTED=$((FLASH_MB * 1024 * 1024))
          if [ "$SIZE" -ne "$EXPECTED" ]; then
            echo "ERROR: unexpected image size $SIZE (expected $EXPECTED)"
            exit 1
          fi
          ls -l "$IMG"

      # 8. Artifact: on main this is a preview image; on a tag the release job picks it up.
      - name: Upload flash image artifact
        uses: actions/upload-artifact@v6
        with:
          name: onyx-flash.img
          path: onyx-flash.img
          if-no-files-found: error

  # =====================================================================
  # RELEASE — creates the GitHub Release and attaches onyx-flash.img.
  # Runs ONLY for v* tags (on main — preview artifact only).
  # =====================================================================
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # GITHUB_TOKEN is needed to create the release and upload the asset
    steps:
      - name: Download flash image
        uses: actions/download-artifact@v6
        with:
          name: onyx-flash.img
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The tag is taken from github.ref automatically (ref_name of the tag).
          files: onyx-flash.img
          generate_release_notes: true
          fail_on_unmatched_files: true
